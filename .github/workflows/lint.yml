name: "Lint"

on:
  push:
    paths:
      - "**.py" # Run if pushed commits include a change to a Python (.py) file.
      - ".github/workflows/lint.yml" # Run if pushed commits include a change to a github actions workflow file.
      - "pyproject.toml" # Run if project configuration file changes.
  pull_request:
    paths:
      - "**.py" # Run if pushed commits include a change to a Python (.py) file.
      - ".github/workflows/lint.yml" # Run if pushed commits include a change to a github actions workflow file.
      - "pyproject.toml" # Run if project configuration file changes.
  workflow_dispatch:

jobs:
  ruff_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Ruff Check
        uses: astral-sh/ruff-action@v3
        with:
          version-file: "uv.lock"
          args: check --output-format=github

      - name: Ruff Format
        uses: astral-sh/ruff-action@v3
        with:
          version-file: "uv.lock"
          args: format --check --diff

  mypy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        # setup-python no longer publishes CPython 3.13.2 for ubuntu-latest.
        run: uv python install 3.13.2

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run mypy
